[package]
name = "fido2_crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Shared native and Web cryptography for the Dart fido2 package"
repository = "https://github.com/nfcim/fido2"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
der = { version = "=0.7.10", features = ["derive"] }
ed25519-dalek = "=2.2.0"
getrandom = { version = "=0.2.17", features = ["js"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
sm2 = { version = "=0.13.3", default-features = false, features = ["dsa", "std"] }
sm3 = "=0.4.2"
subtle = "=2.6.1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"

[dev-dependencies]
hex = "0.4"

[profile.release]
lto = true
opt-level = "s"
