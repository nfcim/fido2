name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    strategy:
      matrix:
        sdk: [stable, beta]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: dart pub get
      - name: Check generated files
        if: runner.os == 'Linux' && matrix.sdk == 'stable'
        run: |
          dart run build_runner build
          changes=$(git status --porcelain --untracked-files=all -- '*.g.dart')
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: dart run bin/setup.dart
      - run: dart run tool/test.dart
      - run: cargo install wasm-pack --locked
        if: runner.os == 'Linux'
      - run: dart run bin/setup.dart --web
        if: runner.os == 'Linux'
      - run: dart run tool/test.dart -p chrome
        if: runner.os == 'Linux'
      - run: dart run tool/test.dart -p chrome -c dart2wasm test/crypto_test.dart test/webauthn_test.dart test/packed_attestation_test.dart test/initialization_test.dart test/fido2_base_test.dart test/cbor_boundaries_test.dart test/fido2_server_auth_data_test.dart test/fido2_credmgmt_test.dart test/api_compatibility_test.dart
        if: runner.os == 'Linux'
      - run: dart doc
      - name: Upload generated dartdoc
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.os }}-${{ matrix.sdk }}
          path: doc/api/
      - name: Evaluate score with pana
        if: runner.os == 'Linux' && matrix.sdk == 'stable'
        run: |
          dart pub global activate pana
          dart pub global run pana .
    #   - name: Run example code
    #     run: |
    #       cd example
    #       dart pub get
    #       dart run lib/main.dart
