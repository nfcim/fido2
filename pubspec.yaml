version: 2.0.1
repository: https://github.com/nfcim/fido2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  cbor: ^6.5.1
  convert: ^3.1.2
  json_annotation: ^4.12.0

dev_dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  elliptic: ^0.4.0
  lints: ^6.1.0
  test: ^1.33.0
  dart_pcsc: ^2.0.2
  build_runner: ^2.14.1
  json_serializable: ^6.14.1
