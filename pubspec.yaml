version: 2.0.0
repository: https://github.com/nfcim/fido2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  cbor: ^6.3.7
  convert: ^3.0.1
  json_annotation: ^4.12.0

dev_dependencies:
  crypto: ^3.0.6
  cryptography: ^2.7.0
  elliptic: ^0.3.11
  lints: ^6.0.0
  test: ^1.25.8
  dart_pcsc: ^2.0.2
  build_runner: ^2.6.0
  json_serializable: ^6.11.0
